[base]
env_name = drone_race_competition
backend_env_name = drone_race

[vec]
total_agents = 2048
num_buffers = 4
num_threads = 8

[env]
num_drones = 64
dt = 0.008333333333333333
num_gates = 4
gate_spacing = 5.0
gate_radius = 1.0
gate_altitude = 1.0
gate_lateral_amplitude = 1.5
start_offset = 2.0
crash_height = 0.0
pos_bound = 20.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 1
max_steps = 57600
time_limit_seconds = 480.0
safety_altitude = 0.0
w_progress = 20.0
w_gate = 3.0
w_finish = 30.0
w_time = 1.0
w_ctrl = 0.01
w_altitude_floor = 0.0
w_descent_floor = 0.0
invalid_penalty = 40.0

# Competition-shaped interface:
# 0 = legacy native privileged observations + raw motor actions.
# 1 = TS-002-shaped telemetry/vision observations + body velocity/yaw-rate commands.
interface_mode = 1
max_cmd_forward = 2.0
max_cmd_lateral = 1.0
max_cmd_vertical = 0.8
max_cmd_yaw_rate = 1.0
setpoint_vel_kp = 0.20
setpoint_att_kp = 0.20
setpoint_rate_kd = 0.04
setpoint_yaw_rate_kp = 0.08
setpoint_thrust_vel_kp = 0.20
setpoint_max_tilt = 0.35
setpoint_max_motor_delta = 0.35

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 1000000
learning_rate = 0.003
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
