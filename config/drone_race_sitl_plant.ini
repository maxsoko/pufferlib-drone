[base]
env_name = drone_race_sitl_plant
backend_env_name = drone_race
cudagraphs = -1

[vec]
# RTX 3070 8GB: 512 agents, 2 buffers (reached epoch 3+ in stable runs). ONE train process only!
total_agents = 512
num_buffers = 2
num_threads = 4

[env]
num_drones = 32
dt = 0.008333333333333333
num_gates = 3
gate_radius = 1.9
gate_spacing = 4.5
gate_lateral_amplitude = 1.0
gate_altitude = 1.0
start_offset = 1.75
crash_height = -1.0
pos_bound = 30.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 0
max_steps = 7200
time_limit_seconds = 60.0
safety_altitude = 0.0
w_progress = 40.0
w_gate = 7.0
w_finish = 80.0
w_time = 0.3
w_ctrl = 0.008
w_altitude_floor = 0.0
w_descent_floor = 0.0
invalid_penalty = 35.0

# Absolute attitude policy contract with the live runner's gyro-closed loop.
interface_mode = 2
sitl_rate_gain_roll = -2.416
sitl_rate_gain_pitch = -2.418
sitl_rate_gain_yaw = -2.189
sitl_hover_thrust = 0.27
sitl_min_thrust = 0.18
sitl_max_thrust = 0.42
sitl_vertical_accel_per_thrust = 36.32
sitl_gravity_m_s2 = 9.80665
sitl_linear_drag = 0.0
sitl_rate_lag_tau_s = 0.12
sitl_max_roll_rad = 0.5
sitl_max_pitch_rad = 0.5
sitl_max_yaw_rad = 3.1415926535
sitl_attitude_kp = 1.5
sitl_body_rate_min_command_rad_s = 0.05
sitl_attitude_error_deadband_rad = 0.004
sitl_max_body_rate_command_rad_s = 0.4

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 25000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.00025
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 2048
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
