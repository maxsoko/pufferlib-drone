[base]
env_name = drone_race_sitl_plant_gate1_fast
backend_env_name = drone_race
# CUDA graphs re-enabled (segfault-on-exit fixed in src/pufferlib.cu).
cudagraphs = 10

[vec]
# RTX 3070 8GB: prior run used 1.2/8G VRAM at 512 agents — headroom for 8x scale.
# ONE train process only (concurrent pufferl corrupts WSL heap).
total_agents = 4096
num_buffers = 8
num_threads = 16

[env]
# One agent per env → 4096 parallel episodes (vs 16 envs × 32 drones).
num_drones = 1
dt = 0.008333333333333333
num_gates = 1
gate_radius = 0.75
gate_spacing = 4.5
gate_lateral_amplitude = 0.0
gate_altitude = 0.0
start_offset = 1.75
crash_height = -1.0
pos_bound = 30.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 0
max_steps = 1200
time_limit_seconds = 10.0
safety_altitude = 0.0
w_progress = 40.0
w_gate = 10.0
w_finish = 80.0
w_time = 0.2
w_ctrl = 0.008
w_altitude_floor = 0.0
w_descent_floor = 0.0
invalid_penalty = 35.0

interface_mode = 2
use_custom_gate_layout = 1
gate0_x = 21.6
gate0_y = 0.3
gate0_z = 0.0

sitl_rate_gain_roll = 2.46
sitl_rate_gain_pitch = -2.42
sitl_rate_gain_yaw = 2.213
sitl_hover_thrust = 0.17
sitl_vertical_accel_per_thrust = 57.69
sitl_gravity_m_s2 = 9.80665
sitl_linear_drag = 0.05
sitl_rate_lag_tau_s = 0.12
sitl_max_roll_rad = 0.5
sitl_max_pitch_rad = 0.5
sitl_max_yaw_rad = 3.1415926535

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 5000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.00025
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
