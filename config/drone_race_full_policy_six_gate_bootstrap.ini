ent_coef = 0.0005
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 4096
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
reward_scale = 1.0
reward_clip = 1.0
