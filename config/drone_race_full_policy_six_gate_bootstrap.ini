seed = 42
total_timesteps = 1000000
learning_start_timesteps = 0
learning_rate = 0.00001
anneal_lr = 1
min_lr_ratio = 0.2
gamma = 0.997
gae_lambda = 0.92
replay_ratio = 1.0
clip_coef = 0.1
