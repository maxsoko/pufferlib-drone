# Live-reproducible adapter: first 23 values are the established camera/IMU/
# action ABI and value 23 is official progress / 6. By default 24..31 are zero;
# observable_gate_phase_onehot changes 24..29 to six active-gate flags while
# preserving reserved zeros 30..31.
observable_gate_index = 0
observable_gate_index_denominator = 6.0
observable_gate_progress = 1
observable_gate_phase_onehot = 0
evaluation_episode_offset = 0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
