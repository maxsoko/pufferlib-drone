[base]
env_name = drone_race_full_policy_official_fit
backend_env_name = drone_race
cudagraphs = 10
# Preserve MinGRU state across rollout chunks. Episode terminals are masked by
# the backend; resetting every 32 steps changes the deployed recurrent policy.
reset_state = False

[vec]
total_agents = 1024
num_buffers = 8
num_threads = 16

[env]
num_drones = 1
dt = 0.016666666666666666

# Full-policy official-fit stage. Course geometry matches the official trace;
# attitude lag and lateral authority are identified from official quaternion,
# relative-gate, and action transitions in config/sitl_policy_dynamics_v3385.json.
num_gates = 4
use_custom_start = 1
start_x = 0.0
start_y = 0.0
start_z = 0.0
start_gate_index = 0
start_elapsed_time = 0.0
start_vx = 0.0
start_vy = 0.0
start_vz = 0.0
start_qw = 1.0
start_qx = 0.0
start_qy = 0.0
start_qz = 0.0
start_wx = 0.0
start_wy = 0.0
start_wz = 0.0
start_offset = 22.35
use_custom_gate_layout = 1
gate0_x = 22.35
gate0_y = 0.19
gate0_z = 0.30
gate1_x = 43.77
gate1_y = 2.04
gate1_z = -3.45
gate2_x = 67.53733
gate2_y = -1.24074
gate2_z = -10.23080
gate3_x = 95.63180
gate3_y = 5.10711
gate3_z = -18.24322
gate_radius = 0.75
# Current training-only aperture curriculum. A fixed evaluation explicitly
# disables sampling and sets gate_radius.
gate_radius_randomize = 0
gate_radius_min = 0.75
gate_radius_max = 0.75
gate0_radius = 0.0
gate1_radius = 0.0
gate2_radius = 0.0
gate3_radius = 0.0
gate_spacing = 25.5
gate_lateral_amplitude = 0.0
gate_altitude = 0.0
# Training-only interpolation around the official lateral/vertical geometry.
course_geometry_scale = 1.0
course_geometry_scale_randomize = 0
course_geometry_scale_min = 0.0
course_geometry_scale_max = 1.0

crash_height = -25.0
pos_bound = 140.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 1
max_steps = 1800
time_limit_seconds = 30.0
safety_altitude = -23.0

w_progress = 35.0
w_gate = 15.0
w_finish = 180.0
w_time = 0.15
w_ctrl = 0.01
w_cross_track = 5.0
cross_track_vertical_weight = 1.0
cross_track_from_gate_index = 0
w_gate_crossing_error = 0.0
gate_crossing_error_from_gate_index = 0
# Dense racing-line credit: approaching a gate should establish the lateral
# velocity required by the next leg instead of waiting for the gate transition.
# Course coordinates remain privileged reward state and never enter observation.
w_gate_exit_lateral_velocity = 50.0
w_gate_exit_velocity = 5.0
gate_exit_target_forward_speed = 10.0
gate_exit_reward_lookahead_m = 10.0
# Optional speed-first curriculum. Enable explicitly for a training branch;
# deterministic evaluation keeps it disabled.
w_forward_speed_excess = 0.0
target_forward_speed = 10.0
w_altitude_floor = 1.0
w_descent_floor = 0.25
w_action_teacher = 0.0
# Training-only dense roll/thrust target derived from the configured course
# spline. These fields are inert unless a curriculum explicitly enables the
# teacher, and they never change or augment the 32-value policy observation.
teacher_course_spline = 0
teacher_from_gate_index = 0
teacher_pitch_from_gate_index = 0
teacher_roll_from_gate_index = 0
teacher_roll_until_gate_index = 16
teacher_thrust_from_gate_index = 0
teacher_pitch_action = -0.50
teacher_roll_per_m = 0.03
teacher_roll_rate_per_m_s = 0.0
teacher_thrust_bias = 0.0
teacher_thrust_per_m = 0.015
teacher_pitch_weight = 1.0
teacher_roll_weight = 1.0
teacher_thrust_weight = 1.0
invalid_penalty = 600.0
# Preserve the solved prefix while allowing a bounded late-gate terminal reward
# to retain radial ordering after train.reward_scale and train.reward_clip.
# Defaults are inert; override these only for a measured late-gate PPO branch.
late_invalid_penalty = 600.0
late_invalid_penalty_from_gate_index = 16

interface_mode = 2
sitl_rate_gain_roll = -2.416
sitl_rate_gain_pitch = -2.418
sitl_rate_gain_yaw = -2.189
sitl_hover_thrust = 0.27
sitl_min_thrust = 0.18
sitl_max_thrust = 0.42
sitl_vertical_accel_per_thrust = 32.81
# config/sitl_policy_dynamics_v3385.json fits world-X and world-Y thrust
# coefficients of 85.5544 and 3.52629 from official-observable traces. Divide
# by the fitted vertical coefficient 32.8054 to obtain the native axis scales.
# The fit is linear and does not support the former 60/0.03 acceleration versus
# braking split, which made speed control effectively bang-bang at the 20 m/s
# clamp. Use the same fitted X coefficient in both directions.
sitl_horizontal_accel_scale = 2.60794
sitl_braking_accel_scale = 2.60794
sitl_lateral_accel_scale = 0.107491
sitl_gate_transition_min_forward_speed = 10.0
# Training-only per-episode dynamics curriculum. Evaluation leaves this off and
# uses the fixed value above.
sitl_gate_transition_min_forward_speed_randomize = 0
sitl_gate_transition_min_forward_speed_min = 10.0
sitl_gate_transition_min_forward_speed_max = 10.0
# Target-gate index at which the post-gate speed floor first applies. Index 1
# preserves the historical boost after Gate 0; index 2 scopes the trace-matched
# Gate-2 closing-speed correction to the transition after Gate 1.
sitl_gate_transition_from_gate_index = 1
# Optional physically observable curriculum mode. Zero retains the historical
# instantaneous post-gate floor; a positive value ramps forward velocity at no
# more than this acceleration until the sampled/fixed floor is reached.
sitl_gate_transition_max_accel_m_s2 = 0.0
# Training-only alternative for the speed-floor impulse/ramp. Zero preserves
# the historical world-X-only boost. One scales the complete outgoing velocity
# so its gate-normal component reaches the same floor without erasing the
# lateral/vertical racing-line direction.
sitl_gate_transition_preserve_velocity_direction = 0
# Optional training-only delay for an instantaneous floor. Zero preserves the
# historical crossing-step impulse. A positive value lets the new official
# gate identity associate before applying the impulse on a later control step.
sitl_gate_transition_delay_steps = 0
sitl_gravity_m_s2 = 8.69
sitl_linear_drag = 0.14
sitl_rate_lag_tau_s = 0.52
sitl_max_roll_rad = 0.50
sitl_max_pitch_rad = 0.50
sitl_max_yaw_rad = 3.1415926535
sitl_lock_hover_thrust = 0
sitl_lock_roll = 0
sitl_lock_yaw = 0
sitl_attitude_kp = 1.5
sitl_body_rate_min_command_rad_s = 0.05
sitl_attitude_error_deadband_rad = 0.004
sitl_max_body_rate_command_rad_s = 0.4

sitl_plant_domain_randomize = 0
sitl_rate_gain_jitter_frac = 0.0
sitl_hover_thrust_jitter = 0.0
sitl_rate_lag_jitter_frac = 0.0
sitl_linear_drag_jitter_frac = 0.0
sitl_gate_obs_dropout_prob = 0.0
sitl_gate_obs_dropout_range_m = 4.25
sitl_gate_obs_dropout_from_index = 1
sitl_gate_range_bias_m = 0.0

# Optional per-agent course randomization. Absolute coordinates remain internal
# simulator state and are never included in the policy observation. The adapter
# values are one-hot race status and phase-gated copies of observable pose/rate.
gate_position_domain_randomize = 0
gate_position_randomize_from_index = 3
gate_position_jitter_x = 0.0
gate_position_jitter_y = 0.0
gate_position_jitter_z = 0.0
observable_gate_index = 1
# Keep phase encoding stable when num_gates is temporarily reduced for the
# gate-by-gate curriculum: official indices are always 0/3, 1/3, 2/3, 3/3.
observable_gate_index_denominator = 3.0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 2000000
learning_rate = 0.00003
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.1
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
