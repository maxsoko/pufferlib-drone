[base]
env_name = drone_race_full_policy_bootstrap
backend_env_name = drone_race
cudagraphs = 10

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 16

[env]
num_drones = 1
dt = 0.008333333333333333

# Stage A bootstrap: the same camera/IMU/action ABI as Stage B, but close enough
# that a complete episode and gate reward fit in a 3M-transition dev cycle.
num_gates = 1
use_custom_start = 1
start_x = 0.0
start_y = 0.0
start_z = 0.0
start_offset = 4.0
use_custom_gate_layout = 1
gate0_x = 4.0
gate0_y = 0.0
gate0_z = 0.0
gate_radius = 0.90
gate_spacing = 4.0
gate_lateral_amplitude = 0.0
gate_altitude = 0.0

crash_height = -5.0
pos_bound = 20.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 1
max_steps = 960
time_limit_seconds = 8.0
safety_altitude = -4.0

w_progress = 35.0
w_gate = 15.0
w_finish = 120.0
w_time = 0.15
w_ctrl = 0.01
w_altitude_floor = 1.0
w_descent_floor = 0.25
# Online behavior-cloning initializer. It is disabled in Stage B and later.
w_action_teacher = 50.0
teacher_pitch_action = -0.50
teacher_roll_per_m = 0.50
invalid_penalty = 60.0

interface_mode = 2
sitl_rate_gain_roll = -2.416
sitl_rate_gain_pitch = -2.418
sitl_rate_gain_yaw = -2.189
sitl_hover_thrust = 0.27
sitl_min_thrust = 0.18
sitl_max_thrust = 0.42
sitl_vertical_accel_per_thrust = 36.32
sitl_gravity_m_s2 = 9.80665
sitl_linear_drag = 0.05
sitl_rate_lag_tau_s = 0.12
sitl_max_roll_rad = 0.50
sitl_max_pitch_rad = 0.50
sitl_max_yaw_rad = 3.1415926535
sitl_lock_hover_thrust = 1
sitl_lock_roll = 1
sitl_lock_yaw = 1
sitl_attitude_kp = 1.5
sitl_body_rate_min_command_rad_s = 0.05
sitl_attitude_error_deadband_rad = 0.004
sitl_max_body_rate_command_rad_s = 0.4

# Bootstrap is nominal; robustness belongs after behavior is learned.
sitl_plant_domain_randomize = 0
sitl_rate_gain_jitter_frac = 0.0
sitl_hover_thrust_jitter = 0.0
sitl_rate_lag_jitter_frac = 0.0
sitl_linear_drag_jitter_frac = 0.0
sitl_gate_obs_dropout_prob = 0.0
sitl_gate_range_bias_m = 0.0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 4000000
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
