[base]
env_name = drone_race_vq2_informed_dreamer
backend_env_name = drone_race_vision
cudagraphs = -1
reset_state = False

[vec]
total_agents = 64
num_buffers = 2
num_threads = 4

[env]
num_drones = 1
dt = 0.015625
num_gates = 6
gate_spacing = 22.0
gate_radius = 1.5
gate_altitude = 1.5
gate_lateral_amplitude = 4.0
start_offset = 5.0
reset_position_noise_xy = 0.5
reset_position_noise_z = 0.25

# SkyDreamer's most compute-efficient exploration curriculum: most episodes
# begin shortly before a uniformly sampled gate, while 30% retain the true
# course start. The active gate is rendered but its index is never given to the
# actor. Promotion/evaluation disables this curriculum and uses full starts.
gate_local_start_curriculum = 1
gate_local_start_probability = 0.70
gate_local_start_offset_min = 2.0
gate_local_start_offset_max = 4.0

# Unknown VQ2 geometry is randomized only in the simulator. It is rendered
# into pixels and never appended to the legal actor slice.
gate_position_domain_randomize = 1
gate_position_domain_randomize_probability = 1.0
gate_position_randomize_from_index = 0
gate_position_jitter_x = 3.0
gate_position_jitter_y = 5.0
# Keep randomized gate centers and their local reset states above the modeled
# ground plane. Course scaling already supplies the larger vertical envelope.
gate_position_jitter_z = 0.5
course_geometry_scale_randomize = 1
course_geometry_scale_min = 0.35
course_geometry_scale_max = 1.0

# Conservative local ground plane. SkyDreamer terminates unsafe near-ground
# descent instead of allowing unsupported flight far below the track.
crash_height = -0.5
pos_bound = 180.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 1
max_steps = 2560
time_limit_seconds = 40.0
safety_altitude = -8.0

# SkyDreamer-style task reward: distance progress plus a centered, one-time
# ordered-gate reward. Discounting makes earlier crossings more valuable, so
# no negative time term or collision penalty is needed. There is no explicit
# perception, alignment, spline, teacher, or prescribed exit-velocity reward.
# Camera pointing and trajectory selection must emerge.
w_progress = 5.0
w_gate = 0.0
w_ordered_gate = 30.0
w_finish = 0.0
w_time = 0.0
w_ctrl = 0.0
# Exact frequency-normalized SkyDreamer exponential body-rate penalty.
w_body_rate = 1.0
w_cross_track = 0.0
w_gate_camera_alignment = 0.0
w_gate_crossing_error = 0.0
w_gate_exit_lateral_velocity = 0.0
w_gate_exit_velocity = 0.0
w_forward_speed_excess = 0.0
w_altitude_floor = 0.0
w_descent_floor = 0.0
w_action_teacher = 0.0
teacher_action_blend = 0.0
teacher_course_spline = 0
invalid_penalty = 0.0
late_invalid_penalty = 0.0

# Deployable full-vector attitude/CTBR contract. The actor emits normalized
# pitch, roll, collective thrust, and yaw targets. The fixed gyro-closed
# conversion produces the supported SET_ATTITUDE_TARGET body-rate/thrust wire
# vector; no classical planner or channel override contributes an action.
interface_mode = 2
sitl_rate_gain_roll = -2.416
sitl_rate_gain_pitch = -2.418
sitl_rate_gain_yaw = -2.189
sitl_hover_thrust = 0.27
sitl_min_thrust = 0.18
sitl_max_thrust = 0.42
sitl_vertical_accel_per_thrust = 32.81
sitl_horizontal_accel_scale = 2.60794
sitl_braking_accel_scale = 2.60794
sitl_lateral_accel_scale = 0.107491
sitl_gravity_m_s2 = 8.69
sitl_linear_drag = 0.14
sitl_rate_lag_tau_s = 0.52
sitl_max_roll_rad = 0.50
sitl_max_pitch_rad = 0.50
sitl_max_yaw_rad = 3.1415926535
sitl_lock_hover_thrust = 0
sitl_lock_roll = 0
sitl_lock_yaw = 0
sitl_attitude_kp = 1.5
sitl_body_rate_min_command_rad_s = 0.05
sitl_attitude_error_deadband_rad = 0.004
sitl_max_body_rate_command_rad_s = 0.4

sitl_plant_domain_randomize = 0
sitl_rate_gain_jitter_frac = 0.0
sitl_hover_thrust_jitter = 0.0
sitl_rate_lag_jitter_frac = 0.0
sitl_linear_drag_jitter_frac = 0.0

visual_observation = 1
visual_camera_hz = 30.0
visual_focal_x_px = 32.0
visual_focal_y_px = 32.0
visual_camera_roll_rad = 0.0
visual_camera_pitch_rad = 0.0
visual_camera_yaw_rad = 0.0
visual_camera_roll_jitter_rad = 0.0872664626
visual_camera_pitch_jitter_rad = 0.0872664626
visual_camera_yaw_jitter_rad = 0.0872664626
visual_camera_dropout_prob = 0.03
visual_edge_dropout_prob = 0.05
visual_edge_corrupt_prob = 0.10
visual_false_segments = 1
visual_line_thickness_px = 1.0
visual_rolling_shutter_s = 0.02

observable_gate_index = 0
observable_gate_progress = 0
observable_gate_phase_onehot = 0

# These sections document the intended model. Training uses the dedicated
# Informed Dreamer entry point rather than Puffer PPO.
[policy]
hidden_size = 256
num_layers = 1
expansion_factor = 1

[torch]
network = MinGRU
encoder = VQ2VisualEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
gamma = 0.997
total_timesteps = 17000000
learning_rate = 0.00004
horizon = 16
