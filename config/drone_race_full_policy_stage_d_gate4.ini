[base]
env_name = drone_race_full_policy_stage_d_gate4
backend_env_name = drone_race
cudagraphs = 10
# Preserve MinGRU state across 32-step rollout chunks. The backend masks only
# agents whose episodes actually terminated.
reset_state = False

[vec]
total_agents = 1024
num_buffers = 8
num_threads = 16

[env]
num_drones = 1
dt = 0.016666666666666666

# Stage D: preserve the officially promoted gates 1-3 policy and extend exactly
# one gate. Gate 4 is calibrated so the promoted policy's native transition
# sees the first stable official active_gate_index=3 observation: 28.80 m
# forward, 5.85 m right, and 4.86 m down.
num_gates = 4
use_custom_start = 1
start_x = 0.0
start_y = 0.0
start_z = 0.0
start_gate_index = 0
start_elapsed_time = 0.0
# When enabled with a nonzero start_gate_index, each agent independently
# resets either at the configured measured segment state or at the official
# race origin. This supplies terminal credit without forgetting the prefix.
mixed_start_curriculum = 0
segment_start_probability = 0.5
start_vx = 0.0
start_vy = 0.0
start_vz = 0.0
start_qw = 1.0
start_qx = 0.0
start_qy = 0.0
start_qz = 0.0
start_wx = 0.0
start_wy = 0.0
start_wz = 0.0
start_offset = 22.35
use_custom_gate_layout = 1
gate0_x = 22.35
gate0_y = 0.19
gate0_z = 0.30
gate1_x = 43.77
gate1_y = 2.04
gate1_z = -3.45
gate2_x = 67.53733
gate2_y = -1.24074
gate2_z = -10.23080
gate3_x = 95.63180
gate3_y = 5.10711
gate3_z = -18.24322
gate_radius = 0.75
# Training-only aperture smoothing. When enabled, every gate in one episode
# shares one radius sampled uniformly from this interval. Exact evaluation must
# keep this disabled and set the fixed promotion radius explicitly.
gate_radius_randomize = 0
gate_radius_min = 0.75
gate_radius_max = 0.75
# Optional training-only per-gate aperture overrides. Zero inherits the global
# radius, allowing one blocking gate to be relaxed and annealed independently.
gate0_radius = 0.0
gate1_radius = 0.0
gate2_radius = 0.0
gate3_radius = 0.0
gate_spacing = 25.5
gate_lateral_amplitude = 0.0
gate_altitude = 0.0
# Training-only interpolation of lateral/vertical gate geometry around the
# official start. 1.0 is the unmodified v3385 course; 0.0 is straight/level.
course_geometry_scale = 1.0
# When enabled, every agent samples one geometry scale per episode. This keeps
# solved and harder full-course rollouts in the same PPO batch without exposing
# the sampled scale or absolute gate coordinates to the policy observation.
course_geometry_scale_randomize = 0
course_geometry_scale_min = 0.0
course_geometry_scale_max = 1.0

crash_height = -25.0
pos_bound = 140.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 1
max_steps = 1800
time_limit_seconds = 30.0
safety_altitude = -23.0

w_progress = 35.0
w_gate = 15.0
w_finish = 180.0
w_time = 0.15
w_ctrl = 0.01
w_cross_track = 5.0
cross_track_vertical_weight = 1.0
# Stage a stronger corridor penalty at a later active gate without changing
# rewards on already-promoted course segments.
cross_track_from_gate_index = 0
# Penalize radial error at the instant of a gate-plane crossing. Disabled by
# default; a curriculum may enable it on a blocking gate while retaining the
# unchanged official-observable policy contract.
w_gate_crossing_error = 0.0
gate_crossing_error_from_gate_index = 0
# Establish the lateral velocity required by the next leg before each gate
# crossing. This supplies dense racing-line credit without exposing future-gate
# coordinates to the policy observation or adding live command arbitration.
w_gate_exit_lateral_velocity = 50.0
# A gate-only sprint exits at the 20 m/s plant cap and leaves about one second
# to reach the lower, offset next gate. Reward the feasible full 3D exit vector
# before every nonterminal crossing; this is training-only course knowledge.
w_gate_exit_velocity = 5.0
gate_exit_target_forward_speed = 10.0
gate_exit_reward_lookahead_m = 10.0
# Training-only dense speed curriculum. Zero keeps the time-trial objective;
# positive values penalize only speed above the target along the active gate
# normal, allowing completion to be learned before speed is annealed upward.
w_forward_speed_excess = 0.0
target_forward_speed = 10.0
w_altitude_floor = 1.0
w_descent_floor = 0.25
w_action_teacher = 0.0
# Training-only dense roll/thrust target derived from the configured course
# spline. This never changes or augments the 32-value policy observation.
teacher_course_spline = 0
teacher_from_gate_index = 0
teacher_pitch_from_gate_index = 0
teacher_roll_from_gate_index = 0
teacher_roll_until_gate_index = 16
teacher_thrust_from_gate_index = 0
teacher_pitch_action = -0.50
teacher_roll_bias = 0.0
teacher_roll_per_m = 0.03
teacher_roll_rate_per_m_s = 0.0
teacher_thrust_bias = 0.0
teacher_thrust_per_m = 0.015
teacher_pitch_weight = 1.0
teacher_roll_weight = 1.0
teacher_thrust_weight = 1.0
invalid_penalty = 600.0

interface_mode = 2
sitl_rate_gain_roll = -2.416
sitl_rate_gain_pitch = -2.418
sitl_rate_gain_yaw = -2.189
sitl_hover_thrust = 0.27
sitl_min_thrust = 0.18
sitl_max_thrust = 0.42
sitl_vertical_accel_per_thrust = 36.32
sitl_horizontal_accel_scale = 60.0
sitl_braking_accel_scale = 0.03
# Official attempt 001 missed the third physical gate 4.6 m laterally. Native
# scale sweeps reproduced that exact two-gate/no-crash signature at 0.60-0.80;
# 0.70 is the transfer-calibrated nominal used for all new promotion evidence.
sitl_lateral_accel_scale = 0.70
sitl_gate_transition_min_forward_speed = 10.0
sitl_gate_transition_min_forward_speed_randomize = 0
sitl_gate_transition_min_forward_speed_min = 10.0
sitl_gate_transition_min_forward_speed_max = 10.0
sitl_gravity_m_s2 = 9.80665
sitl_linear_drag = 0.05
sitl_rate_lag_tau_s = 0.12
sitl_max_roll_rad = 0.50
sitl_max_pitch_rad = 0.50
sitl_max_yaw_rad = 3.1415926535
sitl_lock_hover_thrust = 0
sitl_lock_roll = 0
sitl_lock_yaw = 0
sitl_attitude_kp = 1.5
sitl_body_rate_min_command_rad_s = 0.05
sitl_attitude_error_deadband_rad = 0.004
sitl_max_body_rate_command_rad_s = 0.4

sitl_plant_domain_randomize = 0
sitl_rate_gain_jitter_frac = 0.0
sitl_hover_thrust_jitter = 0.0
sitl_rate_lag_jitter_frac = 0.0
sitl_linear_drag_jitter_frac = 0.0
sitl_gate_obs_dropout_prob = 0.0
# v3385 attempt 004 lost gate 1 at a tracked range of 4.08 m and held that
# officially associated pose through the close-range blind interval. Model the
# same commit requirement on every post-start gate; the transfer curriculum
# increases this threshold gradually before adding course-position variation.
sitl_gate_obs_dropout_range_m = 4.25
sitl_gate_obs_dropout_from_index = 1
sitl_gate_range_bias_m = 0.0

# Optional per-agent course randomization. Absolute coordinates remain internal
# simulator state and are never included in the policy observation. The adapter
# values are one-hot race status and phase-gated copies of observable pose/rate.
gate_position_domain_randomize = 0
gate_position_randomize_from_index = 3
gate_position_jitter_x = 0.0
gate_position_jitter_y = 0.0
gate_position_jitter_z = 0.0
observable_gate_index = 1
observable_gate_index_denominator = 3.0
# Evaluation-only deterministic seed stratum. Training and full promotion use
# zero; development screens may override this to sample later reset sequences.
evaluation_episode_offset = 0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 2000000
learning_rate = 0.00003
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.1
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
