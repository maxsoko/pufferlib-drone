[base]
env_name = drone_race_full_policy_stage_c
backend_env_name = drone_race
cudagraphs = 10

[vec]
# At 60 Hz, 1024 agents produce a complete 30-second episode in 1.84M
# transitions. This makes each 2M development cycle include terminal credit.
total_agents = 1024
num_buffers = 8
num_threads = 16

[env]
num_drones = 1
# The deployed policy emits commands at 60 Hz. Plant integration and policy
# decisions share that cadence here so recurrence learns the deployed timing.
dt = 0.016666666666666666

# Stage C: gates 1-2 from race start. Geometry is inferred from observable
# v3385 camera/IMU traces; coordinates are curriculum construction only and
# are never included in the policy observation.
num_gates = 2
use_custom_start = 1
start_x = 0.0
start_y = 0.0
start_z = 0.0
start_offset = 22.35
use_custom_gate_layout = 1
gate0_x = 22.35
gate0_y = 0.19
gate0_z = 0.30
gate1_x = 43.77
gate1_y = 2.04
gate1_z = -3.45
gate_radius = 0.75
gate_spacing = 21.82
gate_lateral_amplitude = 0.0
gate_altitude = 0.0

crash_height = -14.0
pos_bound = 80.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = 1
max_steps = 1800
time_limit_seconds = 30.0
safety_altitude = -12.0

w_progress = 35.0
w_gate = 15.0
w_finish = 150.0
w_time = 0.15
w_ctrl = 0.01
w_cross_track = 0.0
w_altitude_floor = 1.0
w_descent_floor = 0.25
w_action_teacher = 0.0
teacher_pitch_action = -0.50
teacher_roll_per_m = 0.03
teacher_thrust_per_m = 0.015
invalid_penalty = 600.0

interface_mode = 2
sitl_rate_gain_roll = -2.416
sitl_rate_gain_pitch = -2.418
sitl_rate_gain_yaw = -2.189
sitl_hover_thrust = 0.27
sitl_min_thrust = 0.18
sitl_max_thrust = 0.42
sitl_vertical_accel_per_thrust = 36.32
# Official gate-vector traces cover the 22.35 m first leg in ~4.1 s under the
# same policy that takes ~14 s with the unscaled rigid-body thrust model.
sitl_horizontal_accel_scale = 60.0
sitl_braking_accel_scale = 0.03
sitl_lateral_accel_scale = 1.0
# Official gate-2 camera range closes at roughly 10 m/s immediately after the
# gate-1 transition. This curriculum state reproduces that difficult handoff.
sitl_gate_transition_min_forward_speed = 10.0
sitl_gravity_m_s2 = 9.80665
sitl_linear_drag = 0.05
sitl_rate_lag_tau_s = 0.12
sitl_max_roll_rad = 0.50
sitl_max_pitch_rad = 0.50
sitl_max_yaw_rad = 3.1415926535
sitl_lock_hover_thrust = 0
sitl_lock_roll = 0
# Stage C exercises the same four absolute policy outputs as the official
# runner. Yaw is learnable even when the simple initializer begins at zero.
sitl_lock_yaw = 0
sitl_attitude_kp = 1.5
sitl_body_rate_min_command_rad_s = 0.05
sitl_attitude_error_deadband_rad = 0.004
sitl_max_body_rate_command_rad_s = 0.4

sitl_plant_domain_randomize = 0
sitl_rate_gain_jitter_frac = 0.0
sitl_hover_thrust_jitter = 0.0
sitl_rate_lag_jitter_frac = 0.0
sitl_linear_drag_jitter_frac = 0.0
sitl_gate_obs_dropout_prob = 0.0
sitl_gate_range_bias_m = 0.0

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 2000000
learning_rate = 0.00003
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.1
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
