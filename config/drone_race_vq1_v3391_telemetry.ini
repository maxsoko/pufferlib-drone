[base]
env_name = drone_race_vq1_v3391_telemetry
backend_env_name = drone_race
cudagraphs = 10
reset_state = False

[vec]
total_agents = 512
num_buffers = 8
num_threads = 16

[env]
num_drones = 1
dt = 0.016666666666666666

# Exact six-gate VQ1 v3391 track transfer from the accepted N242 reset proof,
# corrected by N257's clean official Gate-1 pass. The transferred z is the gate
# bottom/base, so each aperture center is transmitted NED z - 2.72/2 = -1.36 m.
# Native course coordinates are (-NED x, -NED y, -NED z), hence +1.36 below.
# These are all six real apertures; there are no synthetic or late-only gates.
num_gates = 6
use_custom_gate_layout = 1
gate0_x = 23.2979679108
gate0_y = 0.3999023438
gate0_z = 1.3919580063
gate1_x = 46.8937492371
gate1_y = 2.4999902248
gate1_z = -3.7080418015
gate2_x = 74.5937500000
gate2_y = -1.2000097036
gate2_z = -12.3080412292
gate3_x = 111.4937438965
gate3_y = 5.0999898911
gate3_z = -23.2080408478
gate4_x = 135.4937438965
gate4_y = 0.7999901772
gate4_z = -23.9956537628
gate5_x = 159.1937408447
gate5_y = 4.3999900818
gate5_z = -24.6080404663

# The rendered aperture is 1.5 m wide in the deployed observation contract.
# A 0.60 m radial acceptance target leaves vehicle/frame clearance rather than
# rewarding rim-skimming trajectories.
gate_radius = 0.60
gate_radius_randomize = 0
gate_spacing = 27.18
course_geometry_scale = 1.0
course_geometry_scale_randomize = 0
gate_position_domain_randomize = 0

use_custom_start = 0
start_offset = 23.2979679108
start_gate_index = 0
mixed_start_curriculum = 0

crash_height = -34.0
pos_bound = 220.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.0
direction_min = 0.01
strict_missed_gate = 1
max_steps = 3600
time_limit_seconds = 60.0
safety_altitude = -32.0

# Dense ordered progress makes a from-scratch policy learnable without a
# hand-authored teacher. Finish credit and strict plane misses keep the optimum
# aligned with a valid six-gate lap; time and control costs select lap speed.
w_progress = 1.0
w_gate = 0.25
w_finish = 50.0
w_time = 0.05
w_ctrl = 0.001
w_cross_track = 0.02
cross_track_vertical_weight = 1.0
cross_track_from_gate_index = 0
w_gate_crossing_error = 1.0
gate_crossing_error_from_gate_index = 0
w_gate_exit_lateral_velocity = 0.05
w_gate_exit_velocity = 0.0
gate_exit_target_forward_speed = 8.0
gate_exit_reward_lookahead_m = 8.0
w_forward_speed_excess = 0.05
target_forward_speed = 12.0
w_altitude_floor = 0.0
w_descent_floor = 0.0
# Bootstrap-only imitation knobs. The deployable/default profile is fully
# policy-owned (both zero); the training script overrides them in phase one.
w_action_teacher = 0.0
teacher_action_blend = 0.0
invalid_penalty = 25.0
late_invalid_penalty = 25.0
late_invalid_penalty_from_gate_index = 0

# Direct local velocity is the simplest exact deployment interface available in
# telemetry-enabled v3391: action [forward, right, down, yaw_rate] maps to one
# SET_POSITION_TARGET_LOCAL_NED publication after native/NED sign conversion.
interface_mode = 3
max_cmd_forward = 12.0
max_cmd_lateral = 8.0
max_cmd_vertical = 8.0
max_cmd_yaw_rate = 1.0
telemetry_velocity_response_tau_s = 0.25
telemetry_velocity_max_accel_m_s2 = 8.0
telemetry_velocity_teacher_speed_m_s = 8.0

# Observation 23 is official progress/6 and 24..29 identify the active gate.
# All target displacement/rate values come from public v3391 track and local
# position telemetry; no simulator-private truth is needed at deployment.
observable_gate_progress = 1
observable_gate_index_denominator = 6.0
observable_gate_phase_onehot = 1

[policy]
hidden_size = 128
num_layers = 2
expansion_factor = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 10000000
learning_start_timesteps = 0
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.997
gae_lambda = 0.95
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 1.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 4096
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
reward_scale = 0.05
reward_clip = 1.0
