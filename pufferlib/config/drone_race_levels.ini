[meta]
schema_version = 1
default_mode = policy
default_suite = drone_race_v1_quick20
strict_suite = drone_race_v1_full100
max_attempts = 3

[levels]
order = L1,L2,L3,L4,L5,L6,L7,L8,L9

[L1]
description = reliability foundation on easy single-gate settings
suite = drone_race_v1_quick20
episodes = 20
metric = valid_rate
operator = >=
threshold = 0.90
env_kwargs = {"num_gates": 1, "gate_spacing": 4.0, "gate_lateral_amplitude": 0.0, "randomize": false, "curriculum": false}

[L2]
description = reach and pass first gate reliably
suite = drone_race_v1_quick20
episodes = 20
metric = first_gate_pass_rate
operator = >=
threshold = 0.90
env_kwargs = {"num_gates": 1, "gate_spacing": 4.0, "gate_lateral_amplitude": 0.0, "randomize": false, "curriculum": false}

[L3]
description = high-confidence one-gate pass rate
suite = drone_race_v1_quick20
episodes = 20
metric = first_gate_pass_rate
operator = >=
threshold = 0.95
env_kwargs = {"num_gates": 1, "gate_spacing": 4.0, "gate_lateral_amplitude": 0.0, "randomize": true, "curriculum": false}

[L4]
description = two-gate sequencing reliability
suite = drone_race_v1_quick20
episodes = 20
metric = two_gate_pass_rate
operator = >=
threshold = 0.90
env_kwargs = {"num_gates": 2, "gate_spacing": 4.5, "gate_lateral_amplitude": 0.8, "randomize": true, "curriculum": true}

[L5]
description = short-sequence robustness under randomization
suite = drone_race_v1_quick20
episodes = 20
metric = success_rate
operator = >=
threshold = 0.80
env_kwargs = {"num_gates": 3, "gate_spacing": 4.5, "gate_lateral_amplitude": 1.0, "randomize": true, "curriculum": true}

[L6]
description = full-lap baseline reliability
suite = drone_race_v1_quick20
episodes = 20
metric = success_rate
operator = >=
threshold = 0.60
env_kwargs = {"num_gates": 4, "gate_spacing": 5.0, "gate_lateral_amplitude": 1.5, "randomize": true, "curriculum": true}

[L7]
description = speed gate after reliability
suite = drone_race_v1_quick20
episodes = 20
metric = median_completion_time_valid
operator = <=
threshold = 18.0
env_kwargs = {"num_gates": 4, "gate_spacing": 5.0, "gate_lateral_amplitude": 1.5, "randomize": true, "curriculum": true}

[L8]
description = consistency gate on consecutive successes
suite = drone_race_v1_quick20
episodes = 20
metric = max_consecutive_successes
operator = >=
threshold = 10
env_kwargs = {"num_gates": 4, "gate_spacing": 5.0, "gate_lateral_amplitude": 1.5, "randomize": true, "curriculum": false}

[L9]
description = strict-suite generalization gate
suite = drone_race_v1_full100
episodes = 100
metric = success_rate
operator = >=
threshold = 0.50
env_kwargs = {"num_gates": 4, "gate_spacing": 5.0, "gate_lateral_amplitude": 1.5, "randomize": true, "curriculum": false}
