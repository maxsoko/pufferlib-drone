[base]
package = drone_hover
env_name = drone_hover_robust
policy_name = SquashedPolicy

[vec]
backend = Serial
num_envs = 1

[env]
dt = 0.02
mass = 1.0
gravity = 9.81
arm_length = 0.2
max_thrust_per_motor = 15.0
linear_damping = 0.05
angular_damping = 0.02
randomize = True
mass_range = 0.05
inertia_range = 0.05
wind_std = 0.3
sensor_noise_std = 0.01
curriculum = True
curriculum_episodes = 3000
action_centered = False
action_centered_scale = 0.3
pd_assist = True
pd_assist_scale = 0.02
pd_assist_scale_final = 0.0
pd_assist_anneal_episodes = 0
pd_kp_xy = 3.8
pd_kd_xy = 3.5
pd_kp_z = 5.0
pd_kd_z = 3.0
pd_kp_ang = 8.0
pd_kd_ang = 2.0
pd_kp_yaw = 0.5
pd_kd_yaw = 0.1
residual_penalty = 0.5
action_smoothing = 0.0
hover_bonus = 0.0
hover_bonus_pos_tol = 0.1
hover_bonus_angle_tol = 10.0
success_bonus = 0.0
hover_curriculum = False
hover_curriculum_min_seconds = 2.0
hover_curriculum_episodes = 1000
target_z = 1.0
pos_bound = 5.0
max_tilt_deg = 45.0
hover_tolerance = 0.25
hover_tolerance_deg = 15.0
success_hold_seconds = 30.0
max_steps = 1500
init_pos_range = 0.1
init_vel_range = 0.05
init_angle_deg = 5.0
init_ang_vel = 0.05
w_pos = 2.0
w_vel = 0.1
w_ang = 0.5
w_angvel = 0.05
w_act = 0.01
w_act_delta = 0.05

[policy]
hidden_size = 256

[train]
total_timesteps = 200_000
num_envs = 1
env_batch_size = 1
bptt_horizon = 64
minibatch_size = 64
batch_size = 64
optimizer = adam
learning_rate = 0.01
ent_coef = 0.001
device = cpu
