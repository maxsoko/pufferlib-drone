[base]
package = drone_race
env_name = drone_race_curriculum_tier1
policy_name = Policy

[vec]
backend = Serial
num_envs = 1

[env]
dt = 0.02
num_gates = 1
gate_spacing = 4.0
gate_radius = 1.4
gate_altitude = 1.0
gate_lateral_amplitude = 0.0
start_offset = 1.5
max_speed_xy = 6.0
max_speed_z = 3.0
max_yaw_rate = 2.0
velocity_response = 0.35
linear_damping = 0.05
crash_height = 0.0
pos_bound = 20.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = True
max_steps = 1200
time_limit_seconds = 25.0
init_position_jitter = 0.02
init_velocity_jitter = 0.02
init_yaw_jitter = 0.05
randomize = False
curriculum = False
curriculum_episodes = 1
perception_adapter = privileged_state
camera_noise_std = 0.0
camera_dropout_prob = 0.0
allow_perception_fallback = True
wind_std = 0.0
wind_std_final = 0.0
w_progress = 20.0
w_gate = 4.0
w_finish = 35.0
w_time = 1.0
w_ctrl = 0.01
invalid_penalty = 35.0

[policy]
hidden_size = 256

[train]
total_timesteps = 100_000
num_envs = 1
env_batch_size = 1
bptt_horizon = 64
minibatch_size = 64
batch_size = 64
optimizer = adam
learning_rate = 0.0003
ent_coef = 0.001
device = cpu
