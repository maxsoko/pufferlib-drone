[base]
package = drone_race
env_name = drone_race_curriculum_tier3
policy_name = Policy

[vec]
backend = Serial
num_envs = 1

[env]
dt = 0.02
num_gates = 4
gate_spacing = 5.0
gate_radius = 1.0
gate_altitude = 1.0
gate_lateral_amplitude = 1.5
start_offset = 2.0
max_speed_xy = 6.0
max_speed_z = 3.0
max_yaw_rate = 2.0
velocity_response = 0.35
linear_damping = 0.05
crash_height = 0.0
pos_bound = 20.0
plane_cross_tolerance = 0.001
miss_tolerance = 0.5
direction_min = 0.05
strict_missed_gate = True
max_steps = 1600
time_limit_seconds = 35.0
init_position_jitter = 0.10
init_velocity_jitter = 0.10
init_yaw_jitter = 0.20
randomize = True
curriculum = True
curriculum_episodes = 3000
wind_std = 0.05
wind_std_final = 0.35
w_progress = 20.0
w_gate = 3.0
w_finish = 30.0
w_time = 1.0
w_ctrl = 0.01
invalid_penalty = 40.0

[policy]
hidden_size = 256

[train]
total_timesteps = 400_000
num_envs = 1
env_batch_size = 1
bptt_horizon = 64
minibatch_size = 64
batch_size = 64
optimizer = adam
learning_rate = 0.0003
ent_coef = 0.001
device = cpu
